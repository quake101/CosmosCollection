name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Update version file (Windows)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
      run: |
        $tag = "${{ github.ref }}".Replace("refs/tags/", "")
        python update_version.py $tag

    - name: Update version file (Linux/macOS)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows-latest'
      run: |
        tag="${{ github.ref }}"
        tag="${tag#refs/tags/}"
        python update_version.py "$tag"

    - name: Build with PyInstaller
      run: |
        pyinstaller CosmosCollection.spec

    - name: Create distribution zip (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path dist/CosmosCollection/* -DestinationPath dist/CosmosCollection-${{ matrix.platform }}.zip

    - name: Create distribution zip (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd dist/CosmosCollection
        zip -r ../CosmosCollection-${{ matrix.platform }}.zip .
        cd ../..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CosmosCollection-${{ matrix.platform }}
        path: dist/CosmosCollection-${{ matrix.platform }}.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/CosmosCollection-${{ matrix.platform }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true