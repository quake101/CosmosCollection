name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: ubuntu-latest
            platform: Linux
          - os: macos-latest
            platform: macOS

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # 3.11 made PyInstaller 6.12.0's Qt-collection hook duplicate the entire Qt6 module
        # set at the top level of _internal/ (in addition to the correct nested copies under
        # PySide6/Qt/lib/). That stray copy sits on LD_LIBRARY_PATH for the whole process
        # tree, including the QtWebEngineProcess child, and reproducibly crashed it (map
        # picker / FOV Simulator renderer process, exit code 1002) on Linux. 3.12 does not
        # have this problem -- confirmed by rebuilding locally with both versions.
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Update version file (Windows)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'windows-latest'
      run: |
        $tag = "${{ github.ref }}".Replace("refs/tags/", "")
        python update_version.py $tag

    - name: Update version file (Linux/macOS)
      if: startsWith(github.ref, 'refs/tags/') && matrix.os != 'windows-latest'
      run: |
        tag="${{ github.ref }}"
        tag="${tag#refs/tags/}"
        python update_version.py "$tag"

    - name: Build with PyInstaller
      run: |
        pyinstaller CosmosCollection.spec

    - name: Build updater helper with PyInstaller
      run: |
        pyinstaller updater/CosmosUpdater.spec

    - name: Bundle updater helper into distribution (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Copy-Item dist/CosmosCollectionUpdater.exe dist/CosmosCollection/CosmosCollectionUpdater.exe

    - name: Bundle updater helper into distribution (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cp dist/CosmosCollectionUpdater dist/CosmosCollection/CosmosCollectionUpdater
        chmod +x dist/CosmosCollection/CosmosCollectionUpdater

    - name: Bundle updater helper into distribution (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cp dist/CosmosCollectionUpdater dist/CosmosCollection.app/Contents/MacOS/CosmosCollectionUpdater
        chmod +x dist/CosmosCollection.app/Contents/MacOS/CosmosCollectionUpdater

    - name: Code sign app bundle (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Ad-hoc signing (-s -, no Apple Developer account/certificate needed) signs the
        # whole .app as one unit, so Gatekeeper evaluates/challenges it once instead of
        # flagging every loose internal binary individually. Deliberately not adding
        # --options runtime (hardened runtime): that's only needed for notarization, and
        # turning it on without the matching entitlements (e.g. allow-jit) can crash
        # Qt WebEngine's Chromium renderer process, which is a worse problem than the one
        # this step is fixing.
        codesign --deep --force -s - dist/CosmosCollection.app
        codesign --verify --deep --strict dist/CosmosCollection.app

    - name: Create distribution zip (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path dist/CosmosCollection/* -DestinationPath dist/CosmosCollection-${{ matrix.platform }}.zip

    - name: Create distribution zip (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd dist/CosmosCollection
        zip -r ../CosmosCollection-${{ matrix.platform }}.zip .
        cd ../..

    - name: Create distribution zip (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # ditto (not zip) preserves the .app bundle's symlinks and code signature
        # correctly - Apple's own recommended way to archive a signed app bundle.
        cd dist
        ditto -c -k --keepParent CosmosCollection.app CosmosCollection-${{ matrix.platform }}.zip
        cd ..

    - name: Generate checksum (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        $hash = (Get-FileHash -Algorithm SHA256 dist/CosmosCollection-${{ matrix.platform }}.zip).Hash.ToLower()
        "$hash  CosmosCollection-${{ matrix.platform }}.zip" | Out-File -Encoding ascii -NoNewline dist/CosmosCollection-${{ matrix.platform }}.zip.sha256

    - name: Generate checksum (Linux/macOS)
      if: matrix.os != 'windows-latest'
      run: |
        cd dist
        sha256sum CosmosCollection-${{ matrix.platform }}.zip > CosmosCollection-${{ matrix.platform }}.zip.sha256
        cd ..

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CosmosCollection-${{ matrix.platform }}
        path: |
          dist/CosmosCollection-${{ matrix.platform }}.zip
          dist/CosmosCollection-${{ matrix.platform }}.zip.sha256

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/CosmosCollection-${{ matrix.platform }}.zip
          dist/CosmosCollection-${{ matrix.platform }}.zip.sha256
        draft: false
        prerelease: false
        generate_release_notes: true